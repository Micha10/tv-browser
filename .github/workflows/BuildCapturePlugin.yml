name: Build Capture Plugin

on:
  push:
    paths:
      - 'captureplugin/**'
      - '.github/workflows/build-capture.yml'
    tags:
      - 'capture-v*'
  pull_request:
    paths:
      - 'captureplugin/**'
  workflow_dispatch:

jobs:
  build-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install JAR to local repo
        run: mvn install:install-file -Dfile=lib/tvbrowser-4.2.7.jar -DgroupId=org.tvbrowser -DartifactId=tvbrowser -Dversion=4.2.7 -Dpackaging=jar

      - name: Build capture plugin only
        run: mvn -s .github/maven-settings.xml -f tvbrowser-plugins/pom.xml -P expensive-modules-to-build -pl plugin-capture -am package

      - name: Upload CapturePlugin.jar
        uses: actions/upload-artifact@v7
        with:
          name: CapturePlugin
          path: tvbrowser-plugins/plugin-capture/target/CapturePlugin.jar

  release:
    needs: build-capture
    if: startsWith(github.ref, 'refs/tags/capture-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: CapturePlugin
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CapturePlugin.jar
          generate_release_notes: true