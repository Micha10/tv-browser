PluginInformationDialog.text=<div style\="font-size\:medium;text-align\:justify"><p>TV-Browser peut \u00EAtre \u00E9tendu avec des fonctions suppl\u00E9mentaires (plugins), par exemple pour contr\u00F4ler le mat\u00E9riel, ajouter d'autres sources de donn\u00E9es, charger des classements de programmes sur Internet et bien plus encore.</p><p>Vous pouvez \u00E9galement trouver plus de plugins <a href\="http\://www.tvbrowser.org/downloads-mainmenu-5/plugins-mainmenu-24.html"> sur notre site Web</a>, qui ne sont actuellement pas disponibles au t\u00E9l\u00E9chargement depuis TV-Browser, mais qui sont pour la plupart d\u00E9j\u00E0 utilisables.</p><p>Voulez-vous voir la liste des plugins disponibles au t\u00E9l\u00E9chargement\u00A0? Vous pouvez toujours ouvrir cette liste en utilisant le menu des plugins.</p></div>
