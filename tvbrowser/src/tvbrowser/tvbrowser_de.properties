TVBrowser.update.gradientColors    = Ab TV-Browser 4.2.2 ist es m\u00F6glich, Sendungen mit Hervorhebungen mit mehreren Farben gleichzeitig darzustellen. Dazu werden Farbverl\u00E4ufe verwendet. Die bisherige Darstellung mit der Farbe der h\u00F6chsten Priorit\u00E4t ist weiterhin verf\u00FCgbar und kann direkt hier oder jederzeit in den Einstellungen unter <b><i>{0}->{1}, {2}</i></b>&nbsp;&nbsp;konfiguriert werden.
TVBrowser.update.primeTimeActivate = Primetime-Update aktivieren
TVBrowser.update.primeTimeUpdate   = Unabh\u00E4ngig von den sonstigen Einstellungen des automatischen Datenpdates, ist es seit TV-Browser 4.2.2 m\u00F6glich ein automatisches Update nur f\u00FCr die Primetime ab 18 Uhr zu aktivieren. Bei Aktivierung wird t\u00E4glich vor der Primetimme ein Update nur f\u00FCr heute und morgen ausgef\u00FChrt. Die Einstellung kann unter <b><i>{0}, {1}</i></b>&nbsp;&nbsp;oder direkt hier aktiviert werden.
