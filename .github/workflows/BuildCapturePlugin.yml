name: Build Capture Plugin

on:
  push:
    paths:
      - 'captureplugin/**'
      - '.github/workflows/build-capture.yml'
  pull_request:
    paths:
      - 'captureplugin/**'
  workflow_dispatch:

jobs:
  build-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install JAR to local repo
        run: mvn install:install-file -Dfile=lib/tvbrowser-4.2.7.jar -DgroupId=org.tvbrowser -DartifactId=tvbrowser -Dversion=4.2.7 -Dpackaging=jar

      - name: Build capture plugin only
        run: mvn -s .github/maven-settings.xml -f tvbrowser-plugins/pom.xml -P expensive-modules-to-build -pl plugin-capture -am package