AuthenticationChannelCardPanel.info2=<div style\="color\:green;font-weight\:bold;font-size\:medium;">Si vous n'avez pas besoin des cha\u00EEnes des sources de donn\u00E9es TV r\u00E9pertori\u00E9es, vous pouvez passer \u00E0 l'\u00E9tape suivante.</div>
AuthenticationChannelCardPanel.info1=<div style\="font-weight\:bold;">Certaines sources de donn\u00E9es TV n\u00E9cessitent une authentification. Vous devez saisir les donn\u00E9es d'authentification si vous souhaitez obtenir des donn\u00E9es TV pour les cha\u00EEnes des sources de donn\u00E9es TV affich\u00E9es.</div>
SubscribeChannelCardPanel.noChannelsSelected=Vous n'avez s\u00E9lectionn\u00E9 aucune cha\u00EEne \u00E0 t\u00E9l\u00E9charger.\nVeuillez s\u00E9lectionner vos cha\u00EEnes pr\u00E9f\u00E9r\u00E9es et les d\u00E9placer dans la case \u00E0 droite.
