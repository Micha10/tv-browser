name: Release Capture Plugin

on:
  push:
    tags:
      - 'capture-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (for example capture-v1.2.3)
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install JAR to local repo
        run: mvn install:install-file -Dfile=lib/tvbrowser-4.2.7.jar -DgroupId=org.tvbrowser -DartifactId=tvbrowser -Dversion=4.2.7 -Dpackaging=jar

      - name: Build capture plugin only
        run: mvn -s .github/maven-settings.xml -f tvbrowser-plugins/pom.xml -P expensive-modules-to-build -pl plugin-capture -am package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: tvbrowser-plugins/plugin-capture/target/CapturePlugin.jar
          fail_on_unmatched_files: true
          generate_release_notes: true
