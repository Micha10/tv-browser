PluginsSoftwareUpdateItem.betawarning.text=<html>\u041F\u043E\u0434\u043A\u043B\u044E\u0447\u0430\u0435\u043C\u044B\u0439 \u043C\u043E\u0434\u0443\u043B\u044C <b>{0}</b> \u044F\u0432\u043B\u044F\u0435\u0442\u0441\u044F \u0431\u0435\u0442\u0430-\u0432\u0435\u0440\u0441\u0438\u0435\u0439.<br>\u0412\u043E\u0437\u043C\u043E\u0436\u043D\u043E, \u0431\u0435\u0442\u0430-\u0432\u0435\u0440\u0441\u0438\u0438 \u043D\u0435\u0441\u0442\u0430\u0431\u0438\u043B\u044C\u043D\u044B \u0438 \u043C\u043E\u0433\u0443\u0442 \u0441\u043E\u0434\u0435\u0440\u0436\u0430\u0442\u044C \u043E\u0448\u0438\u0431\u043A\u0438.<br><br>\u0412\u044B \u0443\u0432\u0435\u0440\u0435\u043D\u044B, \u0447\u0442\u043E \u0445\u043E\u0442\u0438\u0442\u0435 \u0443\u0441\u0442\u0430\u043D\u043E\u0432\u0438\u0442\u044C \u044D\u0442\u0443 \u0432\u0435\u0440\u0441\u0438\u044E? </html>
