TvBrowserDataService.license=<html><body>\u0423\u0441\u043B\u043E\u0432\u0438\u044F \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u043D\u0438\u044F</h1><p>\u0412\u0441\u0435 \u0422\u0412/\u0440\u0430\u0434\u0438\u043E \u0434\u0430\u043D\u043D\u044B\u0435, \u043F\u0440\u0435\u0434\u043E\u0441\u0442\u0430\u0432\u043B\u0435\u043D\u043D\u044B\u0435 TV-Browser (<a href\="http\://www.tvbrowser.org">http\://www.tvbrowser.org</a>) \u0437\u0430\u0449\u0438\u0449\u0435\u043D\u044B \u0437\u0430\u043A\u043E\u043D\u043E\u043C \u043E\u0431 \u0430\u0432\u0442\u043E\u0440\u0441\u043A\u043E\u043C \u043F\u0440\u0430\u0432\u0435 \u0438 \u043C\u043E\u0433\u0443\u0442 \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C\u0441\u044F \u0442\u043E\u043B\u044C\u043A\u043E \u0432  TV-Browser \u0438\u043B\u0438 \u0434\u0440\u0443\u0433\u0438\u0445 \u043F\u0440\u0438\u043B\u043E\u0436\u0435\u043D\u0438\u044F\u0445, \u0430\u0432\u0442\u043E\u0440\u0438\u0437\u043E\u0432\u0430\u043D\u043D\u044B\u0445 \u043F\u0440\u043E\u0438\u0437\u0432\u043E\u0434\u0438\u0442\u0435\u043B\u0435\u043C TV-Browser (<a href\="http\://www.tvbrowser.org">http\://www.tvbrowser.org</a>) \u0434\u043B\u044F \u043F\u043E\u043B\u0443\u0447\u0435\u043D\u0438\u044F \u0438\u043D\u0444\u043E\u0440\u043C\u0430\u0446\u0438\u0438 \u043E \u0433\u0440\u044F\u0434\u0443\u0449\u0438\u0445 \u043F\u0435\u0440\u0435\u0434\u0430\u0447\u0430\u0445 \u0438\u043C\u0435\u044E\u0449\u0438\u0445\u0441\u044F \u043A\u0430\u043D\u0430\u043B\u043E\u0432.</p>\n<p>\u041B\u044E\u0431\u043E\u0435 \u0434\u0440\u0443\u0433\u043E\u0435 \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u043D\u0438\u0435, \u0440\u0430\u0437\u043C\u043D\u043E\u0436\u0435\u043D\u0438\u0435 \u0438\u043B\u0438 \u0440\u0430\u0441\u043F\u0440\u043E\u0441\u0442\u0440\u0430\u043D\u0435\u043D\u0438\u0435 \u0422\u0412/\u0440\u0430\u0434\u0438\u043E \u0434\u0430\u043D\u043D\u044B\u0445 \u043D\u0435\u0437\u0430\u043A\u043E\u043D\u043D\u044B \u0438 \u043C\u043E\u0433\u0443\u0442 \u043F\u0440\u0435\u0441\u043B\u0435\u0434\u043E\u0432\u0430\u0442\u044C\u0441\u044F \u043F\u043E \u0437\u0430\u043A\u043E\u043D\u0443.\n\n\u0421\u043A\u0430\u0447\u0438\u0432\u0430\u044F \u0422\u0412/\u0440\u0430\u0434\u0438\u043E \u0434\u0430\u043D\u043D\u044B\u0435 \u0412\u044B \u0441\u043E\u0433\u043B\u0430\u0448\u0430\u0435\u0442\u0435\u0441\u044C \u0441 \u044D\u0442\u0438\u043C\u0438 \u0443\u0441\u043B\u043E\u0432\u0438\u044F\u043C\u0438.</p>\n<p>\u041F\u043E \u0432\u043E\u043F\u0440\u043E\u0441\u0430\u043C \u043A \u044D\u0442\u0438\u043C \u0443\u0441\u043B\u043E\u0432\u0438\u044F\u043C \u043C\u043E\u0436\u043D\u043E \u043E\u0431\u0440\u0430\u0449\u0430\u0442\u044C\u0441\u044F \u043A <a href\="mailto\:dev@tvbrowser.org">dev@tvbrowser.org</a></p></body></html>
