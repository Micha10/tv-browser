TranslationDialog.helpText=<h1>Aide</h1><h2>Introduction</h2><p>Vous voulez nous aider \u00E0 traduire TV-Browser dans d'autres langues ou corriger notre mauvais anglais\u00A0? Alors cet outil est fait pour vous\u00A0\!</p><h2>Premi\u00E8re \u00E9tape\u00A0\: choisissez la langue</h2><p>En haut, vous voyez une bo\u00EEte avec diff\u00E9rentes langues. Vous pouvez choisir une langue existante ou en cr\u00E9er une nouvelle.</p><h2>Deuxi\u00E8me \u00E9tape\u00A0\: traduire</h2><p>Traduire chaque texte.<ul><li>Les \u00E9l\u00E9ments noirs sont traduits.</li><li >Chaque \u00E9l\u00E9ment rouge de l'arborescence n'est pas traduit.</li><li>Les \u00E9l\u00E9ments en orange sont traduits, mais la mise en forme est diff\u00E9rente de la cha\u00EEne d'origine. Cela signifie que la traduction n'utilise pas les m\u00EAmes cha\u00EEnes d'espace r\u00E9serv\u00E9 ou a une autre fin que le texte d'origine (par exemple, une virgule au lieu d'un point).</li></ul></p><h2>Troisi\u00E8me \u00E9tape\u00A0\: envoyer la traduction </h2><p>Si vous avez termin\u00E9 la traduction, enregistrez-la simplement et envoyez-la \u00E0 dev@tvbrowser.org</p><p>Plus d'aide peut \u00EAtre trouv\u00E9e dans notre Forum\u00A0\: http\://hilfe.tvbrowser.org< /p>
