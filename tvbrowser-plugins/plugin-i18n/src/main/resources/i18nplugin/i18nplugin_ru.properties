TranslationDialog.helpText=<h1>\u041F\u043E\u043C\u043E\u0449\u044C</h1><h2>\u0412\u0432\u0435\u0434\u0435\u043D\u0438\u0435</h2><p>\u0425\u043E\u0442\u0438\u0442\u0435 \u043F\u0435\u0440\u0435\u0432\u0435\u0441\u0442\u0438 TV-Browser \u043D\u0430 \u0434\u0440\u0443\u0433\u043E\u0439 \u044F\u0437\u044B\u043A \u0438\u043B\u0438 \u0438\u0441\u043F\u0440\u0430\u0432\u0438\u0442\u044C \u043D\u0430\u0448 \u043F\u043B\u043E\u0445\u043E\u0439 \u0430\u043D\u0433\u043B\u0438\u0439\u0441\u043A\u0438\u0439 ? \u0422\u043E\u0433\u0434\u0430 \u044D\u0442\u043E \u0434\u043E\u043F\u043E\u043B\u043D\u0435\u043D\u0438\u0435 \u0434\u043B\u044F \u0432\u0430\u0441\!</p><h2>\u041F\u0435\u0440\u0432\u044B\u0439 \u0448\u0430\u0433\: \u0432\u044B\u0431\u0435\u0440\u0438 \u044F\u0437\u044B\u043A</h2><p>\u041D\u0430\u0432\u0435\u0440\u0445\u0443 \u043C\u043E\u0436\u043D\u043E \u0443\u0432\u0438\u0434\u0435\u0442\u044C \u0441\u043F\u0438\u0441\u043E\u043A \u0441 \u0440\u0430\u0437\u043B\u0438\u0447\u043D\u044B\u043C\u0438 \u044F\u0437\u044B\u043A\u0430\u043C\u0438. \u041C\u043E\u0436\u043D\u043E \u0432\u044B\u0431\u0440\u0430\u0442\u044C \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u0443\u044E\u0449\u0438\u0439 \u0438\u043B\u0438 \u0441\u043E\u0437\u0434\u0430\u0442\u044C \u043D\u043E\u0432\u044B\u0439 \u044F\u0437\u044B\u043A.</p><h2>\u0412\u0442\u043E\u0440\u043E\u0439 \u0448\u0430\u0433\: \u043F\u0435\u0440\u0435\u0432\u043E\u0434</h2><p>\u041F\u0435\u0440\u0435\u0432\u043E\u0434\u0438 \u043A\u0430\u0436\u0434\u044B\u0439 \u0442\u0435\u043A\u0441\u0442.<ul><li>\u042D\u043B\u0435\u043C\u0435\u043D\u0442\u044B \u0447\u0435\u0440\u043D\u043E\u0433\u043E \u0446\u0432\u0435\u0442\u0430 \u0443\u0436\u0435 \u043F\u0435\u0440\u0435\u0432\u0435\u0434\u0435\u043D\u044B.</li><li>\u041A\u0430\u0436\u0434\u044B\u0439 \u043A\u0440\u0430\u0441\u043D\u044B\u0439 \u044D\u043B\u0435\u043C\u0435\u043D\u0442 \u043D\u0435 \u043F\u0435\u0440\u0435\u0432\u0435\u0434\u0435\u043D.</li><li>\u041E\u0440\u0430\u043D\u0436\u0435\u0432\u044B\u0435 \u044D\u043B\u0435\u043C\u0435\u043D\u0442\u044B \u043F\u0435\u0440\u0435\u0432\u0435\u0434\u0435\u043D\u044B, \u043D\u043E \u0444\u043E\u0440\u043C\u0430\u0442 \u043E\u0440\u0438\u0433\u0438\u043D\u0430\u043B\u0430 \u0438 \u043F\u0435\u0440\u0435\u0432\u043E\u0434\u0430 \u0440\u0430\u0437\u043B\u0438\u0447\u0430\u044E\u0442\u0441\u044F. \u041B\u0438\u0431\u043E \u0432 \u043F\u0435\u0440\u0435\u0432\u043E\u0434\u0435 \u0434\u0440\u0443\u0433\u043E\u0435 \u043A\u043E\u043B\u0438\u0447\u0435\u0441\u0442\u0432\u043E \u0437\u0430\u043F\u043E\u043B\u043D\u0438\u0442\u0435\u043B\u0435\u0439, \u043B\u0438\u0431\u043E \u043E\u043D \u0437\u0430\u043A\u0430\u043D\u0447\u0438\u0432\u0430\u0435\u0442\u0441\u044F \u043D\u0435 \u043A\u0430\u043A \u043E\u0440\u0438\u0433\u0438\u043D\u0430\u043B (\u0437\u0430\u043F\u044F\u0442\u0430\u044F, \u0430 \u043D\u0435 \u0442\u043E\u0447\u043A\u0430, \u0438.\u0442.\u0434.).</li></ul></p><h2>\u0422\u0440\u0435\u0442\u0438\u0439 \u0448\u0430\u0433\: \u041F\u0440\u0438\u0448\u043B\u0438\u0442\u0435 \u043F\u0435\u0440\u0435\u0432\u043E\u0434 \u043D\u0430\u043C</h2><p>\u041F\u043E \u043E\u043A\u043E\u043D\u0447\u0430\u043D\u0438\u044E \u043F\u0435\u0440\u0435\u0432\u043E\u0434\u0430 \u0441\u043E\u0445\u0440\u0430\u043D\u0438\u0442\u0435 \u0435\u0433\u043E \u0438 \u043F\u0440\u0438\u0448\u043B\u0435\u0442\u0435 \u043F\u043E \u0430\u0434\u0440\u0435\u0441\u0443 dev@tvbrowser.org</p><p>\u0417\u0430 \u043F\u043E\u043C\u043E\u0449\u044C\u044E \u043C\u043E\u0436\u043D\u043E \u043E\u0431\u0440\u0430\u0449\u0430\u0442\u044C\u0441\u044F \u0432 \u0444\u043E\u0440\u0443\u043C\: http\://hilfe.tvbrowser.org</p>
