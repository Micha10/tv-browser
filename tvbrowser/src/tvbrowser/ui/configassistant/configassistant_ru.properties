NetworkCardPanel.closing=<html>\n\u0415\u0441\u043B\u0438 \u0432\u044B <b>\u0441\u0442\u043E\u043B\u043A\u043D\u0443\u043B\u0438\u0441\u044C \u0441 \u0442\u0440\u0443\u0434\u043D\u043E\u0441\u0442\u044F\u043C\u0438</b> \u0432\u044B \u043C\u043E\u0436\u0435\u0442\u0435 \u043F\u043E\u043F\u044B\u0442\u0430\u0442\u044C\u0441\u044F \u043F\u043E\u043B\u0443\u0447\u0438\u0442\u044C \u043F\u043E\u043C\u043E\u0449\u044C \u043D\u0430 <a href\="http\://hilfe.tvbrowser.org">\u043D\u0430\u0448\u0435\u043C \u0444\u043E\u0440\u0443\u043C\u0435</a> (\u0434\u043B\u044F \u044D\u0442\u043E\u0433\u043E \u0432\u0430\u043C \u043F\u043E\u0442\u0440\u0435\u0431\u0443\u0435\u0442\u0441\u044F \u043F\u043E\u0434\u043A\u043B\u044E\u0447\u0435\u043D\u0438\u0435 \u043A \u0418\u043D\u0442\u0435\u0440\u043D\u0435\u0442\u0443)\n<br><br>\n\u041F\u043E\u0436\u0430\u043B\u0443\u0439\u0441\u0442\u0430, \u043D\u0430\u0436\u043C\u0438\u0442\u0435 \u00AB\u0414\u0430\u043B\u0435\u0435\u00BB, \u0435\u0441\u043B\u0438 \u0432\u044B \u0441\u0447\u0438\u0442\u0430\u0435\u0442\u0435, \u0447\u0442\u043E TV-Browser \u043C\u043E\u0436\u0435\u0442 \u043F\u043E\u0434\u043A\u043B\u044E\u0447\u0430\u0442\u044C\u0441\u044F \u043A \u0418\u043D\u0442\u0435\u0440\u043D\u0435\u0442\u0443\!\n</html>
