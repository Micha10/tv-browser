TVBrowser.registryWarning          = L'arr\u00EAt rapide de Windows est activ\u00E9.\nLe d\u00E9lai d'attente avant que Windows ne ferme une application est trop court,\npour donner au navigateur TV suffisamment de temps pour enregistrer tous les param\u00E8tres.\n\nLe param\u00E8tre n'a pas la valeur par d\u00E9faut. Il a \u00E9t\u00E9 chang\u00E9 par un outil ou par vous.\nTV-Browser va maintenant essayer de modifier le d\u00E9lai d'attente.\n\nSi vous ne souhaitez pas modifier ce d\u00E9lai, s\u00E9lectionnez 'Pas cette fois' ou 'Fermer le navigateur TV'.
