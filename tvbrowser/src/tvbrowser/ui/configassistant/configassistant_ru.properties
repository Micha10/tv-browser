WelcomeCardPanel.welcome=<h1>\u0414\u043E\u0431\u0440\u043E \u043F\u043E\u0436\u0430\u043B\u043E\u0432\u0430\u0442\u044C \u0432 \u0422\u0412-\u0411\u0440\u0430\u0443\u0437\u0435\u0440&nbsp;{0}\!</h1><br>\u041F\u0440\u0435\u0436\u0434\u0435 \u0447\u0435\u043C \u0432\u044B \u0441\u043C\u043E\u0436\u0435\u0442\u0435 \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C TV-Browser, \u043D\u0435\u043E\u0431\u0445\u043E\u0434\u0438\u043C\u043E \u0432\u044B\u043F\u043E\u043B\u043D\u0438\u0442\u044C \u043D\u0435\u043A\u043E\u0442\u043E\u0440\u044B\u0435 \u043D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0438.<br><br>\u041D\u0430\u0436\u043C\u0438\u0442\u0435 \u043A\u043D\u043E\u043F\u043A\u0443 <i>\u0414\u0430\u043B\u0435\u0435</i> \u0447\u0442\u043E\u0431\u044B \u043F\u0440\u043E\u0434\u043E\u043B\u0436\u0438\u0442\u044C, \u0438\u043B\u0438 <i>\u041E\u0442\u043C\u0435\u043D\u0430</i> \u0435\u0441\u043B\u0438 \u0432\u044B \u0445\u043E\u0442\u0438\u0442\u0435 \u043D\u0430\u0441\u0442\u0440\u043E\u0438\u0442\u044C \u0422\u0412-\u0431\u0440\u0430\u0443\u0437\u0435\u0440 \u0431\u0435\u0437 \u043F\u043E\u043C\u043E\u0449\u043D\u0438\u043A\u0430.<br><br>\n\u0412\u044B \u043C\u043E\u0436\u0435\u0442\u0435 \u0437\u0430\u043F\u0443\u0441\u0442\u0438\u0442\u044C \u043F\u043E\u043C\u043E\u0449\u043D\u0438\u043A\u0430, \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u044F <i>\u041F\u043E\u043C\u043E\u0449\u044C -&gt; \u041F\u043E\u043C\u043E\u0449\u043D\u0438\u043A \u043F\u043E \u043D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0435</i>.<br><br><br><br>\u0414\u043E\u043F\u043E\u043B\u043D\u0438\u0442\u0435\u043B\u044C\u043D\u0443\u044E \u0438\u043D\u0444\u043E\u0440\u043C\u0430\u0446\u0438\u044E \u043E \u043F\u043E\u043C\u043E\u0449\u043D\u0438\u043A\u0435 \u043F\u043E \u043D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0435 \u043C\u043E\u0436\u043D\u043E \u043D\u0430\u0439\u0442\u0438 \u0432 <a href\="http\://enwiki.tvbrowser.org/index.php/Install">\u043E\u043D\u043B\u