TvBrowserPictureSettingsUpdateDialog.text=<html><span style\="color\:red">ATTENTION\u00A0\: </span>Le t\u00E9l\u00E9chargement des images est d\u00E9sactiv\u00E9\u00A0\!<br><br>\u00CAtes-vous s\u00FBr de ne pas vouloir t\u00E9l\u00E9charger les images.</html>
NetworkCardPanel.preambel=TV-Browser essaiera de <b>se connecter \u00E0 Internet</b> lorsque vous appuyez sur <i>Suivant</i>. Cette op\u00E9ration peut prendre jusqu'\u00E0 30\u00A0secondes.<br><br>\nLa connexion \u00E0 Internet est importante. Sans cela, TV-Browser ne peut pas t\u00E9l\u00E9charger les programmes TV.<br><br><b>Veuillez vous assurer que votre ordinateur est connect\u00E9 \u00E0 Internet avant de cliquer sur <i>Suivant</i>.</b><br> Si vous utilisez un <a href\="http\://enwiki.tvbrowser.org/index.php/Firewalls">pare-feu</a>, veuillez le configurer en cons\u00E9quence.
