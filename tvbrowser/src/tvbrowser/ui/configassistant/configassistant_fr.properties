ConfigAssistant.button.1=Fermer l'Assistant
NetworkCardPanel.connectionError=<html>\n<b>La connexion Internet n'a pas pu \u00EAtre \u00E9tablie\u00A0\!</b><br><br>\nTV-Browser n'a pas pu se connecter \u00E0 Internet.<br>\nCeci est n\u00E9cessaire pour l'installation, car toutes les informations sur les canaux<br>\net les programmes ne sont disponibles qu'en ligne.<br><br>\n<b>Si vous utilisez un pare-feu\u00A0\:</b><br><br>\nAssurez-vous que les param\u00E8tres du pare-feu permettent au <b>Navigateur TV</b> de <b>se connecter \u00E0<br>\ninternet</b>. Vous trouverez des informations sur les <b>param\u00E8tres</b> des pare-feu<br> les plus populaires sur <a href\="http\://enwiki.tvbrowser.org/index.php/Firewalls">notre page d'accueil</a >. Veuillez vous assurer que la connexion Internet fonctionne correctement.<br>\nVous pouvez obtenir de l'<b>aide</b> sur notre <a href\="http\://hilfe.tvbrowser.org">forum en ligne</a> ou aupr\u00E8s de votre administrateur r\u00E9seau\n</html>
NetworkSuccessPanel.success=<h2>Test r\u00E9seau r\u00E9ussi \!</h2>\nTV-Browser a pu se connecter \u00E0 Internet <b>avec succ\u00E8s</b><br><br>\n\u00C0 l'\u00E9tape suivante, TV-Browser r\u00E9cup\u00E9rera une liste de toutes les <b>cha\u00EEnes disponibles</b>.<br><br><br><br>\nVeuillez cliquer sur <i>Suivant</i> pour t\u00E9l\u00E9charger la liste des cha\u00EEnes.\n
NetworkSuccessPanel.noDataService.title=Aucun plugin de donn\u00E9es install\u00E9
ConfigAssistant.cancelDlg=La configuration initiale n'est pas termin\u00E9e.\nComment souhaitez-vous proc\u00E9der ?\n\nVous pouvez red\u00E9marrer cet assistant en utilisant Aide -> Ex\u00E9cuter l'assistant de configuration.
NetworkSuccessPanel.noDataService.msg=Aucun plug-in de donn\u00E9es n'a \u00E9t\u00E9 install\u00E9.\n\nVous devrez installer au moins\nun plugin de donn\u00E9es pour que TV-Browser fonctionne.\n\nRetour \u00E0 l'\u00E9tape pr\u00E9c\u00E9dente.
FinishCardPanel.description=<h2>F\u00E9licitations\u00A0\!</h2>\nVous avez configur\u00E9 avec succ\u00E8s TV-Browser. D\u00E8s que vous cliquez sur "Terminer", l'assistant de configuration se ferme.<br><br>\n<b>Comment continuer\u00A0?</b><br><br>\nNous vous sugg\u00E9rons de consulter rapidement le <a href\="http\://enwiki.tvbrowser.org">guide de l'utilisateur</a> en ligne. Vous y trouverez des <b>trucs et astuces</b> importants qui peuvent vous aider \u00E0 utiliser TV-Browser.<br><br>\nSi vous avez des <b>probl\u00E8mes ou des questions</b>, vous pouvez trouver de l'aide dans notre <a href\="http\://hilfe.tvbrowser.org">forum</a>. <br><br><br><br>\nNous esp\u00E9rons que vous <b>appr\u00E9ciez TV-Browser</b>\!
