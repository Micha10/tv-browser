TVBrowser.registryNotChanged       = <html>Die \u00C4nderung des Registry-Eintrags konnte nicht vorgenommen werden. M\u00F6glicherweise fehlen Ihnen daf\u00FCr die Rechte.<br>Wenden Sie sich in diesem Fall an Ihren Administrator, damit er die \u00C4nderung f\u00FCr Sie durchf\u00FChrt.<br><br><b>Warnung:</b> Folgende Anleitung ist nur f\u00FCr Experten gedacht. Sie k\u00F6nnten Ihr Windows irreparabel zerst\u00F6ren, sollten Sie falsche Werte l\u00F6schen oder \u00E4ndern.<br><br>Damit TV-Browser keine Warnung mehr ausgibt, muss der Wert f\u00FCr <b>WaitToKillAppTimeout</b> im Registry-Pfad<br><b>HKEY_CURRENT_USER\\Control Panel\\Desktop</b> mindestens <b>5000</b> betragen oder der Wert f\u00FCr <b>AutoEndTasks</b> im gleichen Registry-Pfad muss <b>0</b> sein.</html>
TVBrowser.registryWarning          = Das Schnelle Herunterfahren von Windows ist aktviert.\nDie eingegebene Wartezeit, bevor ein Programm von Windows beendet wird, ist jedoch\nzu kurz, um ein sauberes Speichern der Einstellungen von TV-Browser sicherzustellen.\n\nDies ist nicht die Standard-Einstellung von Windows. Entweder wurde diese Einstellung durch ein Tool oder Sie ver\u00E4ndert.\nTV-Browser wird jetzt versuchen die Wartezeit auf einen zuverl\u00E4ssigen Wert zu setzen.\n\nSollten Sie dies nicht w\u00FCnschen, w\u00E4hlen Sie 'Diesmal \u00FCberspringen' oder 'TV-Browser beenden'.
