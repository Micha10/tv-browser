ChannelPanel.help.message      = The CSV file must contain two colums, the order of the internal and external\nchannels can be controlled with the first line of the file.\n\nINT;EXT as first line signals that the first column contains the internal names (of TV-Browser)\nand the external names (of the recording program) are contained in the second column.\nEXT;INT or if the line to control the order is omitted signals that the first column contains\nthe external names and the second column contains the internale names.\n\nTo separate the columns a semicolon (;) is used. If the name of a channel contains a semicolon\nor a backslash it can be marked as being text by using a backslash (\\) in front of it.\nExample: abc\\;xy respectively abc\\\\xy\n\nDo you want to create a CSV file that contains the names of the channel now?\n(It will be created in the encoding of the system your currently using.)
