FinishCardPanel.description=<h2>\u041F\u043E\u0437\u0434\u0440\u0430\u0432\u043B\u044F\u0435\u043C\!</h2>\n\u0412\u044B \u0443\u0441\u043F\u0435\u0448\u043D\u043E \u043D\u0430\u0441\u0442\u0440\u043E\u0438\u043B\u0438 TV-Browser. \u041A\u0430\u043A \u0442\u043E\u043B\u044C\u043A\u043E \u0432\u044B \u043D\u0430\u0436\u043C\u0435\u0442\u0435 \u00AB\u0413\u043E\u0442\u043E\u0432\u043E\u00BB, \u043F\u043E\u043C\u043E\u0449\u043D\u0438\u043A \u043F\u043E \u043D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0435 \u0431\u0443\u0434\u0435\u0442 \u0437\u0430\u043A\u0440\u044B\u0442.<br><br>\n<b>\u041A\u0430\u043A \u043F\u0440\u043E\u0434\u043E\u043B\u0436\u0438\u0442\u044C?</b><br><br>\n\u041C\u044B \u043F\u0440\u0435\u0434\u043B\u0430\u0433\u0430\u0435\u043C \u0432\u0430\u043C \u0431\u044B\u0441\u0442\u0440\u043E \u043E\u0437\u043D\u0430\u043A\u043E\u043C\u0438\u0442\u044C\u0441\u044F \u0441 \u0438\u043D\u0442\u0435\u0440\u0430\u043A\u0442\u0438\u0432\u043D\u044B\u043C <a href\="http\://enwiki.tvbrowser.org">\u0440\u0443\u043A\u043E\u0432\u043E\u0434\u0441\u0442\u0432\u043E\u043C \u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u0435\u043B\u044F</a>. \u0422\u0430\u043C \u0432\u044B \u043D\u0430\u0439\u0434\u0435\u0442\u0435 \u0432\u0430\u0436\u043D\u044B\u0435 <b>\u0441\u043E\u0432\u0435\u0442\u044B \u0438 \u0440\u0435\u043A\u043E\u043C\u0435\u043D\u0434\u0430\u0446\u0438\u0438</b>, \u043A\u043E\u0442\u043E\u0440\u044B\u0435 \u043F\u043E\u043C\u043E\u0433\u0443\u0442 \u0432\u0430\u043C \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C TV-Browser.<br><br>\n\u0415\u0441\u043B\u0438 \u0443 \u0432\u0430\u0441 \u0435\u0441\u0442\u044C <b>\u043F\u0440\u043E\u0431\u043B\u0435\u043C\u044B \u0438\u043B\u0438 \u0432\u043E\u043F\u0440\u043E\u0441\u044B</b>, \u0432\u044B \u043C\u043E\u0436\u0435\u0442\u0435 \u043D\u0430\u0439\u0442\u0438 \u043F\u043E\u043C\u043E\u0449\u044C \u043D\u0430 \u043D\u0430\u0448\u0435\u043C <a href\="http\://hilfe.tvbrowser.org">\u0444\u043E\u0440\u0443\u043C\u0435</a>. <br><br><br><br>\n\u041C\u044B \u043D\u0430\u0434\u0435\u0435\u043C\u0441\u044F, \u0447\u0442\u043E \u0432\u0430\u043C <b>\u043F\u043E\u043D\u0440\u0430\u0432\u0438\u0442\u0441\u044F TV-Browser</b>\!
