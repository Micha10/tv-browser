WelcomeCardPanel.welcome=<h1>Bienvenue dans TV-Browser{0}\u00A0\!</h1><br>Avant de pouvoir utiliser TV-Browser, il y a quelques configurations \u00E0 effectuer.<br><br>Cliquez sur <i>Suivant</i > pour continuer, ou <i>Annuler</i> si vous souhaitez configurer TV-Browser sans l'assistant.<br><br>\nVous pouvez d\u00E9marrer cet assistant en utilisant <i>Aide -&gt; Ex\u00E9cutez l'assistant de configuration</i>.<br><br><br><br>Vous pouvez trouver plus d'aide pour l'assistant de configuration dans le <a href\="http\://enwiki.tvbrowser.org/index.php /Install">manuel en ligne</a>.
NetworkCardPanel.closing=<html>\nSi vous <b>rencontrez des difficult\u00E9s</b> vous pouvez essayer d'obtenir de l'aide sur <a href\="http\://hilfe.tvbrowser.org">notre forum</a> (vous avez besoin d'une connexion Internet pour cela)\n<br><br>\nVeuillez cliquer sur "Suivant" si vous pensez que TV-Browser peut se connecter \u00E0 Internet \!\n</html>
PictureConfigPanel.preambel=Ici, vous pouvez s\u00E9lectionner si les images doivent \u00EAtre t\u00E9l\u00E9charg\u00E9es si la cha\u00EEne prend en charge les images.<br><br>Ce param\u00E8tre <b>affecte uniquement le t\u00E9l\u00E9chargement</b>. Si les images sont affich\u00E9es dans un composant, elles peuvent \u00EAtre d\u00E9finies s\u00E9par\u00E9ment.<br><br>Dans le tableau des programmes, les images seront affich\u00E9es pour les programmes qui sont dans la plage horaire de 18h00 \u00E0 23h00 par d\u00E9faut.
