TvBrowserVersionChangeDlg.text=<div style\="font-size\:large;text-align\:justify"><p>TV-Browser est d\u00E9velopp\u00E9 r\u00E9guli\u00E8rement. Chaque version contient des modifications pour am\u00E9liorer TV-Browser, mais il est parfois n\u00E9cessaire de modifier certaines fonctions qui pourraient entra\u00EEner l'arr\u00EAt de la prise en charge des anciennes versions du plugin.</p><br><div style\="font-weight\:bold;color\u00A0\: red">Nous vous recommandons de mettre \u00E0 jour tous les plugins install\u00E9s maintenant pour garantir un fonctionnement sans erreur. (Il peut arriver qu'une mise \u00E0 jour du plugin soit obligatoire.)</div><p>Vous aurez besoin d'une connexion Internet. Si vous ne disposez pas actuellement d'une connexion Internet, nous vous recommandons de fermer TV-Browser maintenant et d'utiliser la version pr\u00E9c\u00E9dente jusqu'\u00E0 ce qu'une mise \u00E0 jour du plugin soit possible.</p><p>Voulez-vous mettre \u00E0 jour vos plugins maintenant (cela peut prendre quelques temps)\u00A0?</p></div>
