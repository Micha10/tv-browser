NetworkCardPanel.connectionError=<html>\n<b>\u0418\u043D\u0442\u0435\u0440\u043D\u0435\u0442-\u0441\u043E\u0435\u0434\u0438\u043D\u0435\u043D\u0438\u0435 \u043D\u0435 \u043C\u043E\u0436\u0435\u0442 \u0431\u044B\u0442\u044C \u0443\u0441\u0442\u0430\u043D\u043E\u0432\u043B\u0435\u043D\u043E\!</b><br><br>\nTV-Browser \u043D\u0435 \u043C\u043E\u0436\u0435\u0442 \u043F\u043E\u0434\u043A\u043B\u044E\u0447\u0438\u0442\u044C\u0441\u044F \u043A \u0418\u043D\u0442\u0435\u0440\u043D\u0435\u0442\u0443.<br>\n\u042D\u0442\u043E \u043D\u0443\u0436\u043D\u043E \u0434\u043B\u044F \u0423\u0441\u0442\u0430\u043D\u043E\u0432\u043A\u0438, \u0442.\u043A. \u0432\u0441\u044F \u0438\u043D\u0444\u043E\u0440\u043C\u0430\u0446\u0438\u044F \u043E \u043A\u0430\u043D\u0430\u043B\u0430\u0445<br>\n\u0438 \u043F\u0435\u0440\u0435\u0434\u0430\u0447\u0430\u0445 \u0434\u043E\u0441\u0442\u0443\u043F\u043D\u0430 \u0442\u043E\u043B\u044C\u043A\u043E \u043E\u043D\u043B\u0430\u0439\u043D.<br><br>\n<b>\u0415\u0441\u043B\u0438 \u0432\u044B \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u0435\u0442\u0435 \u0431\u0440\u0430\u043D\u0434\u043C\u0430\u0443\u044D\u0440\:</b><br><br>\n\u0423\u0431\u0435\u0434\u0438\u0442\u0435\u0441\u044C, \u0447\u0442\u043E \u043D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0438 \u0431\u0440\u0430\u043D\u0434\u043C\u0430\u0443\u044D\u0440\u0430 \u043F\u043E\u0437\u0432\u043E\u043B\u044F\u044E\u0442 <b>\u0422\u0412-\u0431\u0440\u0430\u0443\u0437\u0435\u0440 \u043F\u043E\u0434\u043A\u043B\u044E\u0447\u0438\u0442\u044C\u0441\u044F \u043A<br>\n\u0418\u043D\u0442\u0435\u0440\u043D\u0435\u0442\u0443</b>. \u0412\u044B \u043D\u0430\u0439\u0434\u0435\u0442\u0435 \u0438\u043D\u0444\u043E\u0440\u043C\u0430\u0446\u0438\u044E \u043E <b>\u043D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0430\u0445</b> \u0441\u0430\u043C\u044B\u0445 \u043F\u043E\u043F\u0443\u043B\u044F\u0440\u043D\u044B\u0445<br>\f\u0431\u0440\u0430\u043D\u0434\u043C\u0430\u0443\u044D\u0440\u0430\u0445 \u043D\u0430 <a href\="http\://enwiki.tvbrowser.org/index.php/Firewalls">\u043D\u0430\u0448\u0435\u0439 \u0434\u043E\u043C\u0430\u0448\u043D\u0435\u0439 \u0441\u0442\u0440\u0430\u043D\u0438\u0446\u0435</a>. \u041F\u043E\u0436\u0430\u043B\u0443\u0439\u0441\u0442\u0430, \u0443\u0431\u0435\u0434\u0438\u0442\u0435\u0441\u044C, \u0447\u0442\u043E \u043F\u043E\u0434\u043A\u043B\u044E\u0447\u0435\u043D\u0438\u0435 \u043A \u0418\u043D\u0442\u0435\u0440\u043D\u0435\u0442\u0443 \u0440\u0430\u0431\u043E\u0442\u0430\u0435\u0442 \u043F\u0440\u0430\u0432\u0438\u043B\u044C\u043D\u043E.<br>\n\u0412\u044B \u043C\u043E\u0436\u0435\u0442\u0435 \u043F\u043E\u043B\u0443\u0447\u0438\u0442\u044C <b>\u043F\u043E\u043C\u043E\u0449\u044C</b> \u043D\u0430 \u043D\u0430\u0448\u0435\u043C <a href\="http\://hilfe.tvbrowser.org">\u043E\u043D\u043B\u0430\u0439\u043D-\u0444\u043E\u0440\u0443\u043C\u0435</a> \u0438\u043B\u0438 \u0443 \u0430\u0434\u043C\u0438\u043D\u0438\u0441\u0442\u0440\u0430\u0442\u043E\u0440\u0430 \u0441\u0435\u0442\u0438.\n</html>
