ChannelPanel.help.message      = Die CSV-Datei muss zwei Spalten enthalten, die Reihenfolge der internen\nund externen Sendernamen kann mit Hilfe der 1. Zeile gesteuert werden.\n\nDie Angabe INT;EXT legt fest, dass die internen Sendernamen (von TV-Browser) in\nder 1. Spalte stehen und die externen Sendernamen (des Aufnahmeprogramms) in der\n2. Spalte. Bei Angabe von EXT;INT oder wenn die Steuerzeile fehlt, wird der externe\nSendername in der 1. Spalte und der interne in der 2. Spalte erwartet.\n\nAls Trennzeichen der Spalten wird das Semikolon (;) verwendet, sollte ein\nSemikolon oder ein Backslash im Text eines Names vorkommen, kann dieses durch einen\nBackslash (\\) als Teil des Textes markiert werden. Beispielsweise\nfolgenderma\u00DFen: abc\\;xy bzw. abc\\\\xy\n\nM\u00F6chten Sie jetzt eine CSV-Datei erstellen, die die Namen der Sender\nenth\u00E4lt (die Datei wird in der Codierung des Systems erstellt)?
